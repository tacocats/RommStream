# Desktop installers: `npm run dist:desktop` (current OS) — see README
# "Desktop builds". The app directory is dist/ (web bundle + Electron main,
# with its own package.json written by scripts/build-electron.mjs), so no
# node_modules are shipped.
appId: com.rommstream.desktop
productName: RommStream
copyright: Copyright © RommStream contributors
directories:
  app: dist
  output: release
  buildResources: electron/resources
files:
  - package.json
  - electron/**
  - web/**
  - '!**/*.map'
  # dist/package.json lists no dependencies, but electron-builder falls back
  # to the React Native project's node_modules when it finds none there.
  - '!node_modules/**'
asar: true

win:
  target:
    - nsis
    - portable
  icon: electron/resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${productName}-${version}-portable.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.games
  icon: electron/resources/icon.png
  # Unsigned until a Developer ID certificate exists; see README.
  identity: null

linux:
  # x64 for PCs, arm64 for Raspberry Pi-class boxes. Nothing native is
  # packaged (see `files`), so both cross-build from either architecture.
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
  category: Game
  icon: electron/resources/icon.png
  maintainer: RommStream contributors <noreply@rommstream.invalid>
  synopsis: Couch-friendly client for a RomM game library
  desktop:
    entry:
      Name: RommStream
      StartupWMClass: RommStream
