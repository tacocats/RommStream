sonar.organization=tacocats
sonar.projectKey=tacocats_RommStream
sonar.projectName=RomMStream

sonar.sources=src,electron,web,App.tsx,index.js
sonar.tests=src,__tests__
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,src/testUtils/**

# Jest only measures src/ (see collectCoverageFrom in jest.config.js), so
# keep everything else out of the coverage figure.
sonar.coverage.exclusions=electron/**,web/**,App.tsx,index.js,src/testUtils/**,src/**/types.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
